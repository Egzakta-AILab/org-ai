name: atlas-drift

# Runs `org atlas drift` on a schedule and on PRs that touch atlas/ or the
# detector code. Produces a JSON artifact and (on PRs) comments the
# findings-count delta so reviewers see what the PR changes.
#
# Why a separate workflow rather than folding into a general CI: drift can
# fail intermittently (Linear API hiccups, network) without that signal
# being load-bearing for the rest of the repo. Keep it isolated so a flap
# here doesn't block merges of unrelated PRs.

on:
  schedule:
    - cron: '17 11 * * 1'  # Mondays 11:17 UTC — quiet hour, off the top-of-hour cron stampede.
  pull_request:
    paths:
      - 'atlas/**'
      - 'org/src/egzakta_org/atlas/**'
      - '.github/workflows/atlas-drift.yml'
  workflow_dispatch: {}   # allow manual runs from the Actions tab

permissions:
  contents: read
  pull-requests: write    # for the PR-comment step

concurrency:
  group: atlas-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install uv
        run: pip install uv

      - name: Install org CLI
        run: uv tool install --editable ./org

      - name: Run drift detector
        id: drift
        env:
          # Optional. When unset (e.g. on fork PRs without secret access) the
          # linear axis emits a single `linear-api-key-missing` info finding
          # rather than failing — see linear_axis.py.
          LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
        run: |
          set +e
          ~/.local/bin/org atlas drift --json --report drift-report.json > drift-stdout.json
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
          finding_count=$(python -c "import json; print(len(json.load(open('drift-report.json'))['findings']))")
          echo "finding_count=$finding_count" >> "$GITHUB_OUTPUT"
          echo "Drift findings: $finding_count"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: atlas-drift-report
          path: drift-report.json
          retention-days: 30

      - name: Comment on PR with finding count
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('drift-report.json', 'utf8'));
            const total = report.findings.length;
            const byAxis = {};
            const byCode = {};
            for (const f of report.findings) {
              byAxis[f.axis] = (byAxis[f.axis] || 0) + 1;
              byCode[f.code] = (byCode[f.code] || 0) + 1;
            }

            const axisRows = Object.entries(byAxis)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([axis, n]) => `| ${axis} | ${n} |`)
              .join('\n');
            const codeRows = Object.entries(byCode)
              .sort(([a], [b]) => a.localeCompare(b))
              .map(([code, n]) => `| \`${code}\` | ${n} |`)
              .join('\n');

            const body = [
              '## atlas drift report',
              '',
              `Total findings: **${total}** (axes run: ${report.axes_run.join(', ')})`,
              '',
              '| axis | count |',
              '|---|---|',
              axisRows || '| — | 0 |',
              '',
              '| code | count |',
              '|---|---|',
              codeRows || '| — | 0 |',
              '',
              total === 0
                ? '_No drift detected against this PR\'s state._'
                : `_Download the \`atlas-drift-report\` artifact from this run for the full JSON._`,
              '',
              '_Generated by [`atlas-drift`](.github/workflows/atlas-drift.yml)._',
            ].join('\n');

            // Update existing bot comment if one exists, else create.
            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            const marker = '## atlas drift report';
            const prior = comments.find(c => c.user.type === 'Bot' && c.body && c.body.startsWith(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                comment_id: prior.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
